<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown@7/dist/turndown.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
</head>
<body>

<!-- Legacy status readout — kept in the DOM (some code paths still write to
     it) but visually folded into the combined indicator; not shown. -->
<div id="status" class="hidden">
  <div id="status-dot"></div>
  <span id="status-text">Connecting…</span>
  <span id="iter-label"></span>
</div>

<div id="env-banner" class="hidden"></div>

<!-- LLM settings dropdown — opened from the combined indicator's dropdown
     ("⚙ Model & parameters", see buildCtxDropdown() in app.js) and anchored to
     #indicator-area (the old standalone gear button is gone). Width-capped,
     aligned label|control rows, draft-then-apply: opening seeds a draft from
     the committed modelOpts/maxIterations/grounding; edits touch only the
     draft; Save commits it (what the next /chat sends), Cancel discards it.
     Order: Model, Context size, Grounding, Temperature, Top-p, Top-k, Max
     iterations, then Reset | Cancel/Save. -->
<div id="settings-panel">
  <div class="setting-group setting-model">
    <label for="opt-model">Model</label>
    <select id="opt-model"></select>
  </div>
  <div class="setting-group">
    <label for="opt-num-ctx">Context size</label>
    <select id="opt-num-ctx">
      <option value="2048">2,048</option>
      <option value="4096">4,096</option>
      <option value="8192">8,192</option>
      <option value="16384">16,384</option>
      <option value="32768">32,768</option>
      <option value="65536" selected>65,536</option>
    </select>
  </div>
  <div class="setting-group setting-grounding">
    <label for="opt-grounding">Fact-check writing before finishing
      <span class="info-affordance" tabindex="0" title="On writing/research tasks, before finishing, Argo re-checks the drafted document's facts and figures against the sources it actually fetched, and blocks completion until unsupported claims are fixed.">ⓘ</span>
    </label>
    <input type="checkbox" id="opt-grounding" checked>
  </div>
  <div class="setting-group">
    <label for="opt-temperature">Temperature</label>
    <div class="setting-control">
      <input type="range" id="opt-temperature" min="0" max="2" step="0.05" value="0.8">
      <span class="opt-val" id="opt-temperature-val">0.8</span>
    </div>
  </div>
  <div class="setting-group">
    <label for="opt-top-p">Top P</label>
    <div class="setting-control">
      <input type="range" id="opt-top-p" min="0" max="1" step="0.05" value="0.9">
      <span class="opt-val" id="opt-top-p-val">0.9</span>
    </div>
  </div>
  <div class="setting-group">
    <label for="opt-top-k">Top K</label>
    <input type="number" id="opt-top-k" min="0" max="200" value="40">
  </div>
  <div class="setting-group">
    <label for="opt-max-iterations">Max iterations</label>
    <div class="setting-control">
      <input type="range" id="opt-max-iterations" min="10" max="1000" step="10" value="1000">
      <span class="opt-val" id="opt-max-iterations-val">1000</span>
    </div>
  </div>
  <div class="settings-actions">
    <button id="settings-reset" type="button">Reset</button>
    <div class="settings-actions-right">
      <button id="settings-cancel" type="button">Cancel</button>
      <button id="settings-save" type="button">Save</button>
    </div>
  </div>
</div>

<!-- Two self-contained, full-height columns. Each is its own vertical flex
     stack with its OWN toolbar on top (mirroring the old unified header's
     two sections, now split one-per-column) so the two halves read as
     parallel VS-Code-like panes. -->
<main>
  <!-- LEFT column — chat half -->
  <section id="chat-panel">
    <div id="toolbar-chat" class="col-toolbar">
      <!-- Breadcrumb: Argo › workspace -->
      <nav id="breadcrumb">
        <a id="nav-home" href="/" title="All workspaces"><span class="flip-h">⛵</span><span class="wordmark"> Argo</span></a>

        <div class="nav-crumb" id="nav-ws" style="display:none">
          <button class="nav-crumb-btn" id="ws-btn"><span id="ws-name-label"></span></button>
          <div class="nav-dropdown" id="ws-dropdown"></div>
        </div>
      </nav>

      <!-- Combined context + status indicator — center shows agent state
           (green=ready / yellow=running, with iteration number / flashing
           violet=compacting); ring shows context usage; tick marks the
           auto-compaction threshold. Click opens a dropdown: a non-clickable
           status+context readout on top, then Model & parameters, View
           context, and Clear conversation actions. -->
      <div id="indicator-area">
        <div class="nav-crumb" id="nav-ctx">
          <span id="token-counter" title="Status &amp; context — click for details"></span>
          <div class="nav-dropdown" id="ctx-dropdown"></div>
        </div>
      </div>
    </div>

    <div id="messages-scroll-wrap">
      <div id="messages">
        <div class="message system">Session started. Ask anything.</div>
      </div>
      <button id="scroll-bottom-btn" class="hidden" type="button" title="Scroll to latest">↓ New messages</button>
    </div>

    <div id="prompt-queue" class="prompt-queue"></div>

    <form id="chat-form">
      <div id="input-wrap">
        <textarea id="input" placeholder="Ask anything… (Shift/Alt+Enter for newline)" rows="3"></textarea>
        <button id="send-btn" type="submit" title="Send">
          <span class="send-icon" id="send-boat"><span class="m1"><span class="m2"><span class="m3"><span class="m4"><span class="boat-glyph">⛵</span></span></span></span></span></span>
          <span class="send-stop hidden" id="send-stop"></span>
        </button>
      </div>
    </form>
  </section>

  <!-- Resize handle (chat | files) -->
  <div id="panel-resize" class="resize-handle"></div>

  <!-- RIGHT column — file/change half -->
  <section id="files-panel">
    <div id="toolbar-files" class="col-toolbar">
      <div class="viewer-toggle" id="files-mode-toggle" title="Switch between the file tree and uncommitted/committed changes">
        <button type="button" class="vt-btn active" data-mode="files">Files</button>
        <button type="button" class="vt-btn" data-mode="changes">Changes</button>
      </div>
      <span id="file-viewer-path"></span>
      <div id="file-viewer-toggle" class="viewer-toggle hidden">
        <button data-mode="preview" class="vt-btn">Preview</button><button data-mode="source" class="vt-btn">Source</button>
      </div>
      <button id="file-viewer-close" class="icon-btn" title="Close">✕</button>
      <button id="refresh-files" class="icon-btn" title="Refresh">↻</button>
      <button id="auto-commit-toggle" class="ac-toggle" type="button" title="Automatically commit the agent's changes after each run">
        <span class="ac-dot"></span>Auto-commit
      </button>
    </div>

    <!-- File tree pane / viewer pane, side by side (VS Code explorer|editor
         style) below the column's toolbar. -->
    <div id="files-panel-body">
      <!-- File tree pane — shows either the file tree (Files mode) or the
           changes list (Changes mode: uncommitted changes + commit history);
           see files-mode-toggle above and renderFiles.../refreshChanges
           in app.js. -->
      <div id="file-tree-pane">
        <div id="files-content">
          <div id="files-tree" class="file-tree"></div>
        </div>
      </div>

      <!-- Resize handle (tree | viewer) -->
      <div id="tree-resize" class="resize-handle"></div>

      <!-- File viewer — path/toggle/close live in the column's toolbar
           (#toolbar-files); this pane is just the content (source, preview,
           or a colorized diff). -->
      <div id="file-viewer-pane">
        <pre id="file-viewer-content" class="file-viewer-empty">Select a file to view</pre>
      </div>
    </div>
  </section>
</main>

<!-- Git log panel — retired: its commit-list + diff role is now the
     Changes mode in #toolbar-files/#files-tree. Kept in the DOM (some code
     paths still write to it) but hidden so there's only one git UI. -->
<div id="git-panel" class="hidden">
  <div id="git-header">
    <div id="git-latest"><span class="muted-sm">Loading…</span></div>
    <button id="refresh-git">↻ Refresh</button>
  </div>
  <div id="git-log"></div>
</div>

<!-- Confirmation dialog — replaces native confirm() -->
<div id="confirm-modal">
  <div id="confirm-box">
    <div id="confirm-message"></div>
    <div id="confirm-actions">
      <button id="confirm-cancel" type="button">✕ Cancel</button>
      <button id="confirm-ok" type="button">✓ Confirm</button>
    </div>
  </div>
</div>

<!-- Toast notifications — replaces native alert() -->
<div id="toast-container"></div>

<!-- Diff / file preview / context viewer modal -->
<div id="diff-modal">
  <div id="diff-box">
    <div id="diff-box-header">
      <span id="diff-title" class="diff-title"></span>
      <div id="diff-header-actions">
        <button id="diff-compact-now" class="hidden" title="Compact context now">⚡ Compact now</button>
        <button id="close-diff">✕ Close</button>
      </div>
    </div>
    <div id="diff-content"></div>
  </div>
</div>

<!-- Shown in standalone mode when no workspace folder has been mounted yet -->
<div id="no-workspace-screen" class="hidden">
  <div id="no-workspace-card">
    <span class="flip-h" id="no-workspace-logo">⛵</span>
    <h1>No workspace mounted</h1>
    <p>Point Argo at a project folder to start working.</p>
    <div id="no-workspace-row">
      <input id="no-workspace-path" type="text" placeholder="/absolute/path/to/project" autocomplete="off" spellcheck="false">
      <button id="no-workspace-btn">Mount folder</button>
    </div>
    <p id="no-workspace-error"></p>
  </div>
</div>

<script src="/preview.js"></script>
<script src="/app.js"></script>
</body>
</html>
